<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FPS Stage 3</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  #stick { position: fixed; left: 30px; bottom: 30px; width: 120px; height: 120px;
           border-radius: 50%; background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.4); }
  #knob { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px;
          border-radius: 50%; background: rgba(255,255,255,.6); }
  #cross { position: fixed; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
           border: 2px solid #fff; border-radius: 50%; opacity: .9; pointer-events: none; }
  #fire { position: fixed; right: 40px; bottom: 30px; width: 100px; height: 100px; border-radius: 50%;
          background: rgba(255,60,60,.35); border: 3px solid rgba(255,255,255,.6);
          display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; font-weight: bold; }
  #score { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); color: #fff;
           font-size: 18px; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #hpbar { position: fixed; left: 20px; top: 14px; width: 160px; height: 14px; border: 2px solid #fff;
           border-radius: 8px; background: rgba(0,0,0,.4); overflow: hidden; pointer-events: none; }
  #hpfill { height: 100%; width: 100%; background: #4c4; }
  #hurt { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; opacity: 0;
          background: radial-gradient(transparent 40%, rgba(255,0,0,.7)); z-index: 5; }
  #start, #rotate, #dead { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex;
           align-items: center; justify-content: center; color: #fff; font-size: 22px;
           text-align: center; background: rgba(0,0,0,.85); z-index: 10; }
  #dead { display: none; z-index: 12; background: rgba(120,0,0,.8); line-height: 1.6; }
  #rotate { display: none; z-index: 11; }
  @media (orientation: portrait) { #rotate { display: flex; } }
  #err { position: fixed; top: 0; left: 0; right: 0; color: #f66; font-size: 12px;
         z-index: 20; padding: 6px; background: rgba(0,0,0,.7); }
</style>
</head>
<body>
<div id="stick"><div id="knob"></div></div>
<div id="cross"></div>
<div id="fire">FIRE</div>
<div id="hpbar"><div id="hpfill"></div></div>
<div id="score">Kills: 0</div>
<div id="hurt"></div>
<div id="start">TAP TO START</div>
<div id="dead"></div>
<div id="rotate">Rotate your phone to landscape</div>
<div id="err"></div>
<script>
const err = document.getElementById('err');
window.onerror = (m, s, l) => { err.textContent += m + ' (line ' + l + ') '; };

document.getElementById('start').addEventListener('click', () => {
  document.getElementById('start').style.display = 'none';
  const el = document.documentElement;
  const fs = el.requestFullscreen ? el.requestFullscreen() : null;
  Promise.resolve(fs)
    .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
    .catch(() => {});
});

const SRCS = [
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
  'https://unpkg.com/three@0.128.0/build/three.min.js'
];
function load(i) {
  if (window.THREE) return init();
  if (i >= SRCS.length) { err.textContent = 'Could not load Three.js - check your internet.'; return; }
  const s = document.createElement('script');
  s.src = SRCS[i];
  s.onload = init;
  s.onerror = () => load(i + 1);
  document.head.appendChild(s);
}
load(0);

function init() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 20, 70);

  const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 1.6, 8);
  camera.rotation.order = 'YXZ';
  scene.add(camera);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x556655, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.6);
  sun.position.set(10, 20, 5);
  scene.add(sun);

  // ---------- World ----------
  const shootables = [], colliders = [], boxMeshes = [];

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshLambertMaterial({ color: 0x4a7c3a })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);
  shootables.push(floor);

  function box(x, z, w, h, d, color) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshLambertMaterial({ color })
    );
    m.position.set(x, h / 2, z);
    scene.add(m);
    shootables.push(m);
    boxMeshes.push(m);
    colliders.push({ minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2 });
  }
  box(0, -30, 60, 4, 1, 0x888888);
  box(0, 30, 60, 4, 1, 0x888888);
  box(-30, 0, 1, 4, 60, 0x888888);
  box(30, 0, 1, 4, 60, 0x888888);
  box(-6, -4, 3, 2, 3, 0xaa6633);
  box(7, -8, 4, 3, 2, 0x996644);
  box(0, -14, 6, 2, 1, 0xbb7744);
  box(-10, -18, 2, 4, 2, 0x777799);
  box(12, 4, 2, 2, 2, 0xaa6633);

  function blocked(x, z, r) {
    for (const b of colliders) {
      if (x > b.minX - r && x < b.maxX + r && z > b.minZ - r && z < b.maxZ + r) return true;
    }
    return false;
  }

  // ---------- Player state ----------
  const PR = 0.45;
  let hp = 100, dead = false, t = 0, lastHurt = -99, hurtOp = 0, score = 0;
  let yaw = 0, pitch = 0, firing = false;
  const scoreEl = document.getElementById('score');
  const hpFill = document.getElementById('hpfill');
  const hurtEl = document.getElementById('hurt');
  const deadEl = document.getElementById('dead');
  const cross = document.getElementById('cross');

  // ---------- Gun ----------
  const gun = new THREE.Mesh(
    new THREE.BoxGeometry(0.08, 0.1, 0.5),
    new THREE.MeshLambertMaterial({ color: 0x222222 })
  );
  gun.position.set(0.22, -0.22, -0.5);
  camera.add(gun);
  const flash = new THREE.Mesh(
    new THREE.SphereGeometry(0.07, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffdd55 })
  );
  flash.position.set(0.22, -0.2, -0.82);
  flash.visible = false;
  camera.add(flash);

  // ---------- Sound ----------
  let ac = null;
  function beep(f0, f1) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(f0, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(f1, ac.currentTime + 0.08);
      g.gain.setValueAtTime(0.12, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.1);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.1);
    } catch (e) {}
  }

  // ---------- Enemies ----------
  const enemies = [];

  function randomSpot(minDist) {
    for (let i = 0; i < 40; i++) {
      const x = (Math.random() - 0.5) * 50, z = (Math.random() - 0.5) * 50;
      if (!blocked(x, z, 1) && Math.hypot(x - camera.position.x, z - camera.position.z) > minDist) return [x, z];
    }
    return [20, -20];
  }

  function makeEnemy() {
    const g = new THREE.Group();
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x2a3b8f });
    const headMat = new THREE.MeshLambertMaterial({ color: 0xe0b090 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.4, 10), bodyMat);
    body.position.y = 0.7;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 10), headMat);
    head.position.y = 1.7;
    const eGun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.7), new THREE.MeshLambertMaterial({ color: 0x111111 }));
    eGun.position.set(0.3, 1.1, 0.45);
    const fl = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 6), new THREE.MeshBasicMaterial({ color: 0xffaa33 }));
    fl.position.set(0.3, 1.1, 0.85);
    fl.visible = false;
    g.add(body, head, eGun, fl);
    body.userData = { enemy: g, part: 'body' };
    head.userData = { enemy: g, part: 'head' };
    g.userData = { hp: 4, cd: 1 + Math.random() * 2, strafe: 1, strafeT: 0,
                   parts: [body, head], mats: [bodyMat, headMat], flash: fl };
    scene.add(g);
    enemies.push(g);
    return g;
  }

  function spawnEnemy(e) {
    const s = randomSpot(14);
    e.position.set(s[0], 0, s[1]);
    e.userData.hp = 4;
    e.visible = true;
    e.userData.parts.forEach(p => { if (!shootables.includes(p)) shootables.push(p); });
  }
  for (let i = 0; i < 4; i++) spawnEnemy(makeEnemy());

  function stepEnemy(e, vx, vz, dt) {
    const nx = e.position.x + vx * dt, nz = e.position.z + vz * dt;
    if (!blocked(nx, e.position.z, 0.5)) e.position.x = nx;
    if (!blocked(e.position.x, nz, 0.5)) e.position.z = nz;
  }

  const losRay = new THREE.Raycaster();
  const tmpO = new THREE.Vector3(), tmpD = new THREE.Vector3();
  function hasLOS(e, dist) {
    tmpO.set(e.position.x, 1.5, e.position.z);
    tmpD.set(camera.position.x - tmpO.x, camera.position.y - tmpO.y, camera.position.z - tmpO.z).normalize();
    losRay.set(tmpO, tmpD);
    losRay.far = dist;
    return losRay.intersectObjects(boxMeshes, false).length === 0;
  }

  function damage(n) {
    if (dead) return;
    hp -= n;
    lastHurt = t;
    hurtOp = 0.8;
    if (hp <= 0) {
      hp = 0; dead = true; firing = false;
      deadEl.innerHTML = 'YOU DIED<br>Kills: ' + score + '<br>Tap to play again';
      deadEl.style.display = 'flex';
    }
  }

  function restart() {
    hp = 100; dead = false; score = 0;
    scoreEl.textContent = 'Kills: 0';
    camera.position.set(0, 1.6, 8);
    yaw = 0; pitch = 0;
    deadEl.style.display = 'none';
    enemies.forEach(spawnEnemy);
  }
  deadEl.addEventListener('click', () => { if (dead) restart(); });

  // ---------- Shooting ----------
  const ray = new THREE.Raycaster();
  const sparkGeo = new THREE.SphereGeometry(0.08, 6, 6);
  const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffee88 });

  function spark(point) {
    const s = new THREE.Mesh(sparkGeo, sparkMat);
    s.position.copy(point);
    scene.add(s);
    setTimeout(() => scene.remove(s), 150);
  }

  function hitEnemy(part) {
    const e = part.userData.enemy, u = e.userData;
    u.hp -= part.userData.part === 'head' ? 2 : 1;
    cross.style.borderColor = '#ff3333';
    setTimeout(() => { cross.style.borderColor = '#fff'; }, 100);
    u.mats.forEach(m => m.emissive.setHex(0xffffff));
    setTimeout(() => u.mats.forEach(m => m.emissive.setHex(0x000000)), 60);
    if (u.hp <= 0) {
      e.visible = false;
      u.parts.forEach(p => { const i = shootables.indexOf(p); if (i >= 0) shootables.splice(i, 1); });
      score++;
      scoreEl.textContent = 'Kills: ' + score;
      setTimeout(() => { if (!e.visible && !dead) spawnEnemy(e); }, 3000);
    }
  }

  function shoot() {
    gun.position.z = -0.38;
    flash.visible = true;
    setTimeout(() => { flash.visible = false; }, 40);
    beep(300, 60);
    ray.setFromCamera({ x: 0, y: 0 }, camera);
    const hits = ray.intersectObjects(shootables, false);
    if (hits.length) {
      const h = hits[0];
      if (h.object.userData.enemy) hitEnemy(h.object);
      spark(h.point);
    }
  }

  // ---------- Controls ----------
  const move = { x: 0, y: 0 };
  const stick = document.getElementById('stick');
  const knob = document.getElementById('knob');
  let stickId = null, lookId = null, fireId = null, lastX = 0, lastY = 0;

  function setKnob(dx, dy) {
    const max = 40;
    const len = Math.hypot(dx, dy);
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    knob.style.left = (40 + dx) + 'px';
    knob.style.top = (40 + dy) + 'px';
    move.x = dx / max;
    move.y = dy / max;
  }
  function stickMove(tc) {
    const r = stick.getBoundingClientRect();
    setKnob(tc.clientX - (r.left + r.width / 2), tc.clientY - (r.top + r.height / 2));
  }

  addEventListener('touchstart', e => {
    for (const tc of e.changedTouches) {
      if (tc.target.id === 'fire') {
        if (fireId === null) { fireId = tc.identifier; firing = true; }
      } else if (tc.clientX < innerWidth / 2 && stickId === null) {
        stickId = tc.identifier; stickMove(tc);
      } else if (tc.clientX >= innerWidth / 2 && lookId === null) {
        lookId = tc.identifier; lastX = tc.clientX; lastY = tc.clientY;
      }
    }
  }, { passive: false });

  addEventListener('touchmove', e => {
    e.preventDefault();
    for (const tc of e.changedTouches) {
      if (tc.identifier === stickId) {
        stickMove(tc);
      } else if (tc.identifier === lookId) {
        yaw -= (tc.clientX - lastX) * 0.005;
        pitch -= (tc.clientY - lastY) * 0.005;
        pitch = Math.max(-1.4, Math.min(1.4, pitch));
        lastX = tc.clientX; lastY = tc.clientY;
      }
    }
  }, { passive: false });

  addEventListener('touchend', e => {
    for (const tc of e.changedTouches) {
      if (tc.identifier === stickId) { stickId = null; setKnob(0, 0); }
      if (tc.identifier === lookId) lookId = null;
      if (tc.identifier === fireId) { fireId = null; firing = false; }
    }
  });

  // ---------- Loop ----------
  const clock = new THREE.Clock();
  const SPEED = 5, LIMIT = 28;
  let cooldown = 0;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    t += dt;

    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    if (!dead) {
      // player movement with collisions
      const fwd = -move.y, side = move.x;
      const dx = (-Math.sin(yaw) * fwd + Math.cos(yaw) * side) * SPEED * dt;
      const dz = (-Math.cos(yaw) * fwd - Math.sin(yaw) * side) * SPEED * dt;
      const nx = camera.position.x + dx;
      if (!blocked(nx, camera.position.z, PR)) camera.position.x = nx;
      const nz = camera.position.z + dz;
      if (!blocked(camera.position.x, nz, PR)) camera.position.z = nz;
      camera.position.x = Math.max(-LIMIT, Math.min(LIMIT, camera.position.x));
      camera.position.z = Math.max(-LIMIT, Math.min(LIMIT, camera.position.z));

      // shooting
      cooldown -= dt;
      if (firing && cooldown <= 0) { shoot(); cooldown = 0.12; }

      // enemies
      enemies.forEach(e => {
        if (!e.visible) return;
        const u = e.userData;
        const ex = camera.position.x - e.position.x, ez = camera.position.z - e.position.z;
        const dist = Math.max(0.01, Math.hypot(ex, ez));
        const nxn = ex / dist, nzn = ez / dist;
        e.rotation.y = Math.atan2(ex, ez);
        let vx = 0, vz = 0;
        if (dist > 9) {
          vx = nxn * 2.4; vz = nzn * 2.4;
        } else {
          u.strafeT -= dt;
          if (u.strafeT <= 0) { u.strafe = Math.random() < 0.5 ? -1 : 1; u.strafeT = 1 + Math.random() * 2; }
          vx = -nzn * 1.6 * u.strafe; vz = nxn * 1.6 * u.strafe;
        }
        stepEnemy(e, vx, vz, dt);
        u.cd -= dt;
        if (u.cd <= 0 && dist < 28) {
          u.cd = 1.2 + Math.random() * 1.1;
          if (hasLOS(e, dist)) {
            u.flash.visible = true;
            setTimeout(() => { u.flash.visible = false; }, 60);
            beep(150, 50);
            if (Math.random() < Math.max(0.12, 0.6 - dist * 0.02)) damage(8);
          }
        }
      });

      // slow regen
      if (t - lastHurt > 4 && hp < 100) hp = Math.min(100, hp + 6 * dt);
    }

    hurtOp = Math.max(0, hurtOp - dt * 1.2);
    hurtEl.style.opacity = hurtOp;
    hpFill.style.width = hp + '%';
    hpFill.style.background = hp < 35 ? '#d33' : '#4c4';
    gun.position.z += (-0.5 - gun.position.z) * Math.min(1, 12 * dt);

    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}
</script>
</body>
</html>
